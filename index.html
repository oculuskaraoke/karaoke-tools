<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oculus Karaoke Syllabifier</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #121212; color: #e0e0e0; }
        h2, p { color: #ffffff; }
        textarea { width: 100%; height: 250px; padding: 15px; margin-bottom: 15px; box-sizing: border-box; background-color: #1e1e1e; color: #ffffff; border: 1px solid #444; border-radius: 8px; font-size: 16px; resize: none; overflow-y: auto; }
        .button-group { display: flex; gap: 10px; margin-bottom: 5px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .copy-btn { background: #28a745; }
        .copy-btn:hover { background: #218838; }
        #status { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

    <h2>👁️ Oculus Karaoke Syllabifier</h2>
    <p>Paste your lyrics below. Slashes will be added automatically.</p>
    <span id="status">⏳ Loading Dictionary...</span>

    <textarea id="input_box" placeholder="Paste lyrics here..."></textarea>
    
    <div class="button-group">
        <button onclick="processLyrics()">Add Slashes</button>
        <button class="copy-btn" onclick="copyToClipboard()">Copy Result</button>
    </div>
    
    <textarea id="output_box" placeholder="Result will appear here..."></textarea>

    <script>
        // 1. Storage
        const masterDict = new Map();
        
        // 2. Custom Overrides (These ALWAYS win)
        const overrides = new Map([
            // Karaoke specifics
            ["karaoke", "ka/ra/o/ke"],
            ["you", "you"], 
            ["every", "ev/ery"],
            ["said", "said"],

            // Multi-Syllable Contractions (Forces the correct slash placement)
            ["isn't", "is/n't"],
            ["aren't", "are/n't"],
            ["wasn't", "was/n't"],
            ["weren't", "were/n't"],
            ["haven't", "have/n't"],
            ["hasn't", "has/n't"],
            ["hadn't", "had/n't"],
            ["doesn't", "does/n't"],
            ["didn't", "did/n't"],
            ["wouldn't", "would/n't"],
            ["shouldn't", "should/n't"],
            ["couldn't", "could/n't"],
            ["mustn't", "must/n't"],
            ["needn't", "need/n't"],
            ["mightn't", "might/n't"],
            ["oughtn't", "ought/n't"],

            // Single-Syllable Contractions (Protects them from bad dictionary splits)
            ["can't", "can't"],
            ["won't", "won't"],
            ["don't", "don't"],
            ["ain't", "ain't"],
            ["i'm", "i'm"],
            ["i've", "i've"],
            ["i'll", "i'll"],
            ["i'd", "i'd"],
            ["you're", "you're"],
            ["you've", "you've"],
            ["you'll", "you'll"],
            ["you'd", "you'd"],
            ["he's", "he's"],
            ["he'll", "he'll"],
            ["he'd", "he'd"],
            ["she's", "she's"],
            ["she'll", "she'll"],
            ["she'd", "she'd"],
            ["it's", "it's"],
            ["we're", "we're"],
            ["we've", "we've"],
            ["we'll", "we'll"],
            ["we'd", "we'd"],
            ["they're", "they're"],
            ["they've", "they've"],
            ["they'll", "they'll"],
            ["they'd", "they'd"],
            ["that's", "that's"],
            ["who's", "who's"],
            ["what's", "what's"],
            ["where's", "where's"],
            ["when's", "when's"],
            ["why's", "why's"],
            ["how's", "how's"],
            ["let's", "let's"],
            ["y'all", "y'all"]
        ]);

        // 3. Load the Dictionary automatically on page load
        async function loadDictionary() {
            try {
                // Looks for dictionary.txt in your GitHub repo
                const response = await fetch('dictionary.txt');
                if (!response.ok) throw new Error("File not found");
                
                const text = await response.text();
                const lines = text.split('\n');
                
                let count = 0;
                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;
                    
                    // Convert any dashes or dots in the file to slashes
                    let slashed = line.replace(/[-•·¥�]/g, '/');
                    // Strip the slashes to create a pure alphabetical lookup key
                    let cleanWord = slashed.replace(/\//g, '').toLowerCase();
                    
                    masterDict.set(cleanWord, slashed);
                    count++;
                }
                document.getElementById('status').innerText = `✅ Engine Ready: Loaded ${count.toLocaleString()} perfect words.`;
            } catch (error) {
                document.getElementById('status').innerText = `⚠️ dictionary.txt not found. Running on Custom Overrides only.`;
            }
        }

        // Helper: Match original capitalization
        function matchCasing(original, slashed) {
            // 1. Force the dictionary result to a clean lowercase slate
            slashed = slashed.toLowerCase();
            
            // 2. If your original lyric was ALL CAPS (e.g. "FAST")
            if (original === original.toUpperCase() && original.length > 1) {
                return slashed.toUpperCase();
            }
            // 3. If your original lyric was Title Case (e.g. "Fast")
            if (original[0] === original[0].toUpperCase()) {
                return slashed.charAt(0).toUpperCase() + slashed.slice(1);
            }
            
            // 4. If your original lyric was lowercase, return lowercase
            return slashed;
        }

        // 4. The Processing Logic
        function processLyrics() {
            const inputText = document.getElementById('input_box').value;
            const lines = inputText.split('\n');
            const processedLines = [];
            
            for (let line of lines) {
                const words = line.split(' ');
                const processedWords = [];
                
                for (let word of words) {
                    // GLOBAL FIX: Handle hyphenated words (like track-star) by splitting them first
                    const subWords = word.split('-');
                    const processedSubWords = [];
                    
                    for (let sub of subWords) {
                        const match = sub.match(/^([^a-zA-Z]*)([a-zA-Z]+(?:'[a-zA-Z]+)*)([^a-zA-Z]*)$/);
                        
                        if (match) {
                            const prefix = match[1];
                            const cleanWord = match[2];
                            const suffix = match[3];
                            const lookup = cleanWord.toLowerCase();
                            
                            let slashedWord = cleanWord; 
                            
                            // GLOBAL FIX: Never split words that are 1 or 2 letters long (fixes "is", "to", "do")
                            if (cleanWord.length <= 2) {
                                slashedWord = cleanWord;
                            }
                            // 1. Check Overrides
                            else if (overrides.has(lookup)) {
                                slashedWord = overrides.get(lookup);
                            } 
                            // 2. Check Master Dictionary
                            else if (masterDict.has(lookup)) {
                                slashedWord = masterDict.get(lookup);
                            }
                            // 3. The "Dropped G" Gerund Fallback (e.g. talkin -> talk/in)
                            else if (lookup.endsWith("in")) {
                                const gerundLookup = lookup + "g";
                                if (masterDict.has(gerundLookup)) {
                                    let gerundSlashed = masterDict.get(gerundLookup);
                                    slashedWord = gerundSlashed.replace(/ing$/i, 'in');
                                }
                            }
                            
                            slashedWord = matchCasing(cleanWord, slashedWord);
                            processedSubWords.push(prefix + slashedWord + suffix);
                        } else {
                            // Leave pure punctuation/numbers alone
                            processedSubWords.push(sub);
                        }
                    }
                    // Rejoin the hyphenated parts (e.g., track + - + star)
                    processedWords.push(processedSubWords.join('-'));
                }
                processedLines.push(processedWords.join(' '));
            }
            document.getElementById('output_box').value = processedLines.join('\n');
        }
        // Copy button logic
        function copyToClipboard() {
            const outputText = document.getElementById('output_box').value;
            navigator.clipboard.writeText(outputText).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const origText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.style.background = "#1e7e34";
                setTimeout(() => {
                    copyBtn.innerText = origText;
                    copyBtn.style.background = "#28a745";
                }, 2000);
            });
        }

        // Boot the engine when the script loads
        loadDictionary();
        
        // Small polyfill for push/append array difference in logic
        Array.prototype.append = function(item) { this.push(item); };
    </script>

</body>
</html>
